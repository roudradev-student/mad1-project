{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
</head>
<body>
    <div class="hero">

    <div class="blur"></div>

    <div class="content">
        <h1>Niyoga</h1>
        <p>Where ambitions meet opportunities</p>
    </div>

</div>
</body>
</html>



<style>
body{
    margin:0;
    font-family:Arial;
}

.hero{
    position:relative;
    height:100vh;
}

.blur{
    position:absolute;
    width:100%;
    height:100%;

    background-image:url("static/jobify front page.png");
    background-size:cover;
    background-position:center;


    filter:blur(6px);
}

.content{
    position:relative;
    color:white;
    text-align:center;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    height:100vh;
}

h1{
    font-size:100px;
    font-weight:bold;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    font-style: oblique;
    color: #eee4eaeb;
    margin-bottom: 5px;

}
p{
    font-size:30px;
    font-weight:500;
    font-family: 'Pacifico', cursive;
}

button{
    padding:12px 25px;
    border:none;
    background:orange;
    color:white;
    font-size:18px;
    border-radius:5px;
}

button:hover{
    background:#ff6600;
}

</style>


{% endblock %}
