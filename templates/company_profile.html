{% extends "base.html" %}
{% block title %}create comapny profile{% endblock %}


{% block content %}

<div class="blur"></div>
<div class="box">

    <h2>Complete Company Profile</h2>

    <form  action="/complete-company-profile" method="POST">

        <input type="text" name="company_name" placeholder="Company Name">
        <input type="text" name="industry" placeholder="Industry">
        <input type="text" name="website" placeholder="Website">
        <input type="text" name="location" placeholder="Location">
        <input type="text" name="hr_contact" placeholder="HR Contact Number">

        <button type="submit">Save Profile</button>

    </form>

</div>

<style>
     body{
    font-family: Arial;
    background-color: #d11339;
}

.box{
    width: 450px;
    margin: auto;
    margin-top: 140px;
    margin-bottom: 30px;
    background: rgb(224, 195, 232);
    padding: 25px;
    border-radius: 8px;
    backdrop-filter: blur(50px);
}

h2{
    text-align: center;
    font-family: 'Pacifico', cursive;
    font-weight:bolder;
    font-size: 45px;
    font-style: normal;
    color:rgba(179, 27, 42, 0.947);
}

form{
    display: flex;
    flex-direction: column;
}

input, select{
    margin-bottom: 15px;
    padding: 10px;
}

button{
    padding: 10px;
    background:#020617;
    color: white;
    border: none;
    border-radius: 8px;
}


label{
    color:black
}

p{
    text-align: center;
    color: black;
}

button{
    background: rgb(2, 0, 27);
    color: white;
    border: none;
    border-radius: 8px;
    opacity: 0.9;
    font-weight: bold;
}

.login-link{
    text-align: center;
    margin-top: 15px;
}

.blur{
    position:absolute;
    width:100%;

    background-image:url("static/dashboard image.png");
