<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Niyoga{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">Niyoga</div>

    <div class="menu">
        <a href="/">Home</a>
        {% if session.get('user_id') %}
           <a href="/logout">Logout</a>
        {% endif %}
        {% if not session.get('user_id') %}
        <a href="/login">Login</a>
        <a href="/register" class="nav-btn">Register</a>
        {% endif %}
        
    </div>
</nav>

<!-- Page Content -->
{% block content %}{% endblock %}

<footer>
    © 2026 Placement Portal | All Rights Reserved
</footer>

</body>
</html>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background:linear-gradient(120deg, #020617, #0f172a);
    color: #000000;
    margin-top: 0%;
    margin-bottom: 0%;
}

/* NAVBAR */
.navbar {
    background: rgba(188, 20, 36, 0.947);
    backdrop-filter: blur(10px);
    padding: 18px 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1e293b;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 40px;
    font-weight: bold;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    color: #d0e1e8;
    letter-spacing: 1px;
    font-style: oblique;
}

.menu {
    display: flex;
    align-items: center;
}

.menu a {
    color: #cbd5e1;
    margin-left: 35px;
    text-decoration: none;
    font-weight: 1000;
    font-size: 20px;
    position: relative;
    transition: 0.3s ease;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}




.menu a:hover {
    color:  rgb(2, 0, 27);
}



/* Button */
.nav-btn {
    margin-left: 40px;
    padding: 8px 18px;
    background: #030b31;
    color: #ffffff !important;
    border-radius: 6px;
    font-weight: 600;
}

.nav-btn:hover {
    background: rgb(224, 195, 232);
    color:   #030b31!important;
}

footer {
    background:   #030b31!important;
    text-align: center;
    padding: 20px;
    margin-top: 60px;
    border-top: 1px solid #1e293b;
    color: #94a3b8;
}

.container {
    width: 85%;
    margin: auto;

}
</style>
