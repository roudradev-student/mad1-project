{% extends "base.html" %}
{% block title %}Create Job Posting{% endblock %}


{% block content %}

<div class="blur"></div>
<div class="box">

    <h2>Create Job Posting</h2>

    <form  action="/job-posting" method="POST">

        <input type="text" name="description" placeholder="Job Description">
        <input type="text" name="title" placeholder="Job Title">
        <input type="text" name="skills" placeholder="Required Skills">
        <input type="text" name="experience" placeholder="Required Experience">
        <input type="text" name="salary" placeholder="Salary Range">
        <input type="text" name="location" placeholder="Location">
        <select name="job_type">
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Internship">Internship</option>
        </select>

        <button type="submit">Post Job</button>

    </form>

</div>

<style>
     body{
    font-family: Arial;
    background-color: #d11339;
}

.box{
    width: 450px;
    margin: auto;
    margin-top: 140px;
    margin-bottom: 30px;
    background: rgb(224, 195, 232);
    padding: 25px;
    border-radius: 8px;
    backdrop-filter: blur(50px);
}

h2{
    text-align: center;
    font-family: 'Pacifico', cursive;
    font-weight:bolder;
    font-size: 45px;
    font-style: normal;
    color:rgba(179, 27, 42, 0.947);
}

form{
    display: flex;
    flex-direction: column;
}

input, select{
    margin-bottom: 15px;
    padding: 10px;
}

button{
    padding: 10px;
    background:#020617;
    color: white;
    border: none;
    border-radius: 8px;
}


label{
    color:black
}

p{
    text-align: center;
    color: black;
}

button{
    background: rgb(2, 0, 27);
    color: white;
    border: none;
    border-radius: 8px;
    opacity: 0.9;
    font-weight: bold;
}

.login-link{
    text-align: center;
    margin-top: 15px;
}

.blur{
    position:absolute;
    width:100%;
    height:120%;

    background-image:url("static/we-are-hiring-old-vintage-sign_583952-13393.jpg");
    background-size:cover;
    background-position: 70% 130%;


    filter:blur(3px);
}


</style>

{% endblock %}
