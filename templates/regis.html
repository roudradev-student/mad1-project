{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="blur"></div>
<div class="wrapper">

    <h2>Create Your Account</h2>

    <form action="/register" method="POST">

        <label>Name</label>
        <input type="text" name="name" required placeholder="Enter your name">

        <label>Email</label>
        <input type="email" name="email" required placeholder="Enter your email">

        <label>Contact Number</label>
        <input type="tel" name="contact_number" pattern="[0-9]{10}" required placeholder="Enter 10 digit number">
        
        <label>Role</label>
        <select name="role">
            <option value="applicant">Applicant</option>
            <option value="company">Company</option>
        </select>
    
        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter your password">
       
        
        <button type="submit" class="subtn">Sign Up</button>

    </form>
    
    <p class="login-link">
        Already have an account? 
        <a href="/login">Login</a>
    </p>


</div>

<style>
    body{
    font-family: Arial;
    background-color: #d11339;
}

.wrapper{
    width: 350px;
    margin: auto;
    margin-top: 140px;
    margin-bottom: 30px;
    background: rgb(224, 195, 232);
    padding: 25px;
    border-radius: 8px;
    backdrop-filter: blur(50px);
}

h2{
    text-align: center;
    font-family: 'Pacifico', cursive;
    font-weight:bolder;
    font-size: 45px;
    font-style: normal;
    color:rgba(179, 27, 42, 0.947);
}

form{
    display: flex;
    flex-direction: column;
}

input, select{
    margin-bottom: 15px;
    padding: 10px;
}

button{
    padding: 10px;
    background:#020617;
    color: white;
    border: none;
    border-radius: 8px;
}


label{
    color:black
}

p{
    text-align: center;
    color: black;
}

button{
    background: rgb(2, 0, 27);
    color: white;
    border: none;
    border-radius: 8px;
    opacity: 0.9;
    font-weight: bold;
}

.login-link{
    text-align: center;
    margin-top: 15px;
}

.blur{
    position:absolute;
    width:100%;
    height:120%;

    background-image:url("static/registration page image.png");
    background-size:cover;
    background-position: 70% 130%;


    filter:blur(3px);
}

.subtn:hover{
          background: rgba(188, 20, 36, 0.947);
          color:   #030b31!important;
}

</style>
{% endblock %}
