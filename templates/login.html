{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
  <div class="blur"></div>

  <div class="wrapper">

    <h2>Login</h2>

    <form action="/login" method="POST">

        <label>Email</label>
        <input type="email" name="email" required placeholder="Enter your registered email">

        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter your password">

        <button type="submit">Login</button>

    </form>

    <p class="login-link">
        Don't have an account?
        <a href="/register">Register</a>
    </p>

</div>

</body>
</html>
<style>
    body{
    font-family: Arial;
    background-color: #d11339;
}

.wrapper{
    width: 350px;
    margin: auto;
    margin-top: 100px;
    margin-bottom: 90px;
    background: rgb(224, 195, 232);
    padding: 20px;
    border-radius: 8px;
    backdrop-filter: blur(50px);
}

h2{
    text-align: center;
    font-family: 'Pacifico', cursive;
    font-weight:bolder;
    font-size: 40px;
    font-style: normal;
    color:rgba(179, 27, 42, 0.947);
}


form{
    display: flex;
    flex-direction: column;
}

input, select{
    margin-bottom: 15px;
    padding: 9px;
}

button{
    padding: 10px;
    background: rgb(2, 0, 27);
    color: white;
    border: none;
    border-radius: 8px;
}

label{
    color:black
}

p{
    text-align: center;
    color: black;
}

button{
    background: #020617;
    color: white;
    border: none;
    border-radius: 8px;
    opacity: 0.9;
    font-weight: bold;
}

.login-link{
    text-align: center;
    margin-top: 15px;
}

.blur{
    position:absolute;
    width:100%;
    height:90%;

    background-image:url("static/we-are-hiring-old-vintage-sign_583952-13393.jpg");
    background-size:cover;
    background-position: 70% bottom;


    filter:blur(3px);
}



</style>
{% endblock %}
